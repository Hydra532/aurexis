<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurexis Client | TikTok</title>
</head>

<body>
    <h1>Aurexis Client</h1>
    <h2>TikTok Authorization</h2>

    <p id="status">Processing TikTok authorization...</p>

    <script>
        const params = new URLSearchParams(window.location.search);

        const code = params.get("code");
        const error = params.get("error");

        if (error) {
            document.getElementById("status").textContent =
                "TikTok authorization was cancelled or failed.";
        } else if (code) {
            document.getElementById("status").textContent =
                "TikTok authorization successful. You may close this page.";
        } else {
            document.getElementById("status").textContent =
                "No TikTok authorization information was received.";
        }
    </script>
</body>
</html>
